<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="NexaLM — private, self-hosted LLM chat. Your AI. Your Control." />
    <!-- Matches --bg in each theme so the browser chrome does not seam against the app. -->
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>NexaLM — Your AI. Your Control.</title>

    <!-- The mark as inline SVG: crisp at every density, and the gradient
         reads on both a light and a dark tab strip without a second file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322D3EE'/><stop offset='.48' stop-color='%233B82F6'/><stop offset='1' stop-color='%238B5CF6'/></linearGradient></defs><path d='M16 2.2 27.95 9.1v13.8L16 29.8 4.05 22.9V9.1Z' fill='url(%23g)' opacity='.14'/><path d='M16 2.2 27.95 9.1v13.8L16 29.8 4.05 22.9V9.1Z' fill='none' stroke='url(%23g)' stroke-width='3' stroke-linejoin='round'/><path d='M10.4 22.2V9.8l11.2 12.4V9.8' fill='none' stroke='url(%23g)' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('llm-theme');
          var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
